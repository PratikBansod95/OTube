[package]
name = "adblock_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "adblock_ffi"

[dependencies]
adblock = { path = "../adblock-rust", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "0.21"
serde_json = "1.0"
# rmp 0.8.15 removed APIs still used by rmp-serde 0.15.x (adblock-rust dep)
rmp = "=0.8.14"
